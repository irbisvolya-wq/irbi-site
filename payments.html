<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRBI — Оплати клієнтів</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f4f7f5;color:#123a32}main{max-width:1050px;margin:30px auto;padding:20px}.card{background:white;padding:22px;border-radius:16px;margin:16px 0}label{display:block;margin:14px 0}input,select{display:block;padding:12px;width:100%;max-width:600px}table{border-collapse:collapse;width:100%;min-width:700px}td,th{text-align:left;padding:12px;border-bottom:1px solid #dce7e1}</style></head><body><main><a href="/finance.html">Повернутися до фінансів</a><h1>Оплати клієнтів</h1><p id="status" role="status"></p><button id="refresh" type="button" class="btn btn-secondary">Оновити</button><div id="content" hidden><section class="card"><h2>Зафіксувати отриману оплату</h2><p>Вносіть лише фактично отримані кошти за завершене замовлення. Запис не переказує гроші. Повернення та онлайн-оплати звіряються окремо.</p><form id="paymentForm"><label>Завершене замовлення<select id="booking" required></select></label><p id="balance"></p><label>Отримана сума, ₴<input id="amount" type="number" min="0.01" max="1000000" step="0.01" required></label><label>Спосіб<select id="method"><option value="cash">Готівка</option><option value="bank_transfer">Банківський переказ</option></select></label><label>Фактична дата й час отримання<input id="paidAt" type="datetime-local" required></label><label>Пояснення / номер підтвердження<input id="note" minlength="3" maxlength="300" required></label><label><input id="confirmed" type="checkbox" style="display:inline;width:auto" required> Кошти фактично отримані й перевірені</label><button id="save" class="btn btn-primary" type="submit">Записати оплату</button></form></section><section class="card"><h2>Останні 100 платежів</h2><div style="overflow:auto"><table><thead><tr><th>Замовлення</th><th>Сума</th><th>Статус</th><th>Спосіб</th><th>Дата отримання</th><th>Пояснення</th></tr></thead><tbody id="rows"></tbody></table></div></section></div></main><script type="module" src="/payments.js?v=20261119-1"></script></body></html>
