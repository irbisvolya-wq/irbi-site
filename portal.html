<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>IRBI — Вхід і кабінет</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;background:#f4f7f5} .portal-wrap{max-width:1060px;margin:45px auto;padding:24px}.portal-card{background:white;border-radius:18px;padding:26px;box-shadow:0 5px 22px #123a3210;margin-bottom:20px}.portal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.portal-card input{width:100%;padding:13px;margin:8px 0 16px;border:1px solid #c9d4cf;border-radius:8px}.portal-card button{cursor:pointer}.portal-card label{display:block} .hidden{display:none!important}.portal-table{width:100%;border-collapse:collapse}.portal-table th,.portal-table td{border-bottom:1px solid #eee;padding:9px;text-align:left;font-size:14px}.muted{color:#586c65}.notice{padding:12px;border-radius:8px;background:#ebf5f0;margin:12px 0} #authMessage{min-height:24px} .portal-actions{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><div class="portal-wrap"><p><a href="/">← На головну IRBI</a></p><h1>IRBI — особистий кабінет</h1><section id="authPanel" class="portal-card"><h2 id="authTitle">Увійти</h2><div class="portal-actions"><button id="showLogin" type="button" class="btn btn-secondary">Вхід</button><button id="showRegister" type="button" class="btn btn-secondary">Реєстрація клієнта</button></div><form id="authForm"><label>Електронна пошта<input id="email" type="email" autocomplete="email" required></label><label>Пароль (від 8 символів)<input id="password" type="password" minlength="8" autocomplete="current-password" required></label><label id="nameLabel" class="hidden">Ім’я<input id="fullName" type="text" maxlength="120"></label><button id="submitAuth" class="btn btn-primary" type="submit">Увійти</button></form><p id="authMessage" role="status" aria-live="polite"></p><p class="muted">Працівники й адміністратори входять зі своїми запрошеними обліковими записами. Самостійна реєстрація створює лише клієнтський доступ.</p></section><section id="dashboard" class="hidden"><div class="portal-card"><div class="portal-actions"><h2 id="dashboardTitle">Мій кабінет</h2><button id="logout" class="btn btn-secondary" type="button">Вийти</button></div><p id="accountInfo"></p><div class="notice" id="roleNotice"></div></div><div class="portal-card"><h3 id="ordersTitle">Замовлення</h3><p id="ordersStatus" role="status"></p><div style="overflow-x:auto"><table class="portal-table"><thead><tr><th>Номер</th><th>Дата</th><th>Статус</th><th>Сума</th></tr></thead><tbody id="ordersBody"></tbody></table></div></div></section></div><script type="module" src="/portal.js"></script></body></html>
