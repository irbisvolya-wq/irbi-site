name: Application checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: for source in *.js; do node --check "$source" || exit 1; done
      - name: Run regression and site integrity checks
        run: node --test tests/*.cjs tests/*.mjs
