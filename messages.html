<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRBI — Повідомлення клієнтів</title><link rel="stylesheet" href="/styles.css"><style>body{background:#f4f7f5;color:#123a32}.wrap{max-width:1050px;margin:30px auto;padding:20px}.card{background:#fff;border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 4px 18px #123a3211}label{display:block;margin:8px 0}select,textarea{width:100%;padding:12px;border:1px solid #bacdc1;border-radius:9px}textarea{min-height:110px}.hide{display:none!important}.chat{padding:12px;background:#edf6ef;margin:8px 0;border-radius:10px;white-space:pre-wrap}</style></head><body><main class="wrap"><p><a href="/portal.html">← Робочий кабінет</a></p><h1>Повідомлення клієнтів</h1><p id="status" role="status">Перевіряємо права доступу…</p><section id="content" class="card hide"><h2>Заявки</h2><label>Оберіть заявку<select id="booking"></select></label><p id="orderDetails"></p><div id="messages"></div><form id="replyForm"><label>Відповідь клієнту<textarea id="reply" maxlength="2000" required placeholder="Введіть відповідь клієнту"></textarea></label><button class="btn btn-primary" type="submit">Відправити відповідь</button></form><button id="reload" class="btn btn-secondary" type="button">Оновити повідомлення</button></section></main><script type="module" src="/messages.js"></script></body></html>
